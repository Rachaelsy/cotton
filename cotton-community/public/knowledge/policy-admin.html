<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>公益小程序管理后台 · 喀什优棉</title>
  <link rel="stylesheet" href="/knowledge/styles.css">
  <style>
    .policy-admin-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);gap:22px}.editor-card,.preview-card{background:#fff;border:1px solid #e2e8e4;border-radius:18px;padding:22px}.policy-fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.policy-fields .full{grid-column:1/-1}.policy-fields label{display:block;margin-bottom:7px;font-weight:700;color:#28483c}.policy-fields input,.policy-fields select,.policy-fields textarea{width:100%;box-sizing:border-box;border:1px solid #d7e1db;border-radius:10px;padding:11px 12px;font:inherit}.policy-fields textarea{min-height:340px;resize:vertical;font-family:Consolas,monospace;line-height:1.65}.markdown-preview{min-height:500px;line-height:1.8;color:#29443a}.markdown-preview h1,.markdown-preview h2,.markdown-preview h3{color:#165b43;margin:20px 0 10px}.markdown-preview blockquote{margin:14px 0;padding:10px 16px;border-left:4px solid #42a77e;background:#edf7f2}.markdown-preview code{padding:2px 6px;border-radius:5px;background:#f0f3f1}.policy-list-actions{display:flex;gap:8px}.editor-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.preview-meta{padding-bottom:15px;border-bottom:1px solid #e8eeea;color:#7a8982}.hidden{display:none!important}@media(max-width:1000px){.policy-admin-grid{grid-template-columns:1fr}.policy-fields{grid-template-columns:1fr}.policy-fields .full{grid-column:auto}}
  </style>
</head>
<body class="admin-page">
  <header class="admin-top"><div class="admin-top-inner"><span class="brand-mark">棉</span><h1>喀什优棉公益小程序管理后台</h1><div class="admin-links"><a href="/public/" target="_blank">查看公益平台</a><button class="small-btn" id="logoutBtn">退出登录</button></div></div></header>
  <main class="admin-shell">
    <nav class="admin-tabs"><button class="admin-tab active">政策中心</button></nav>
    <section id="listPanel">
      <div class="admin-toolbar"><div><h2>政策文章</h2><p class="question-excerpt">草稿不会出现在小程序；发布后小程序政策中心将读取最新内容。</p></div><button class="btn" id="addBtn">新增政策</button></div>
      <div class="data-table-wrap"><table class="data-table"><thead><tr><th>标题</th><th>层级/分类</th><th>发布单位</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="articleTable"><tr><td colspan="6">加载中...</td></tr></tbody></table></div>
    </section>
    <section id="editorPanel" class="hidden">
      <div class="admin-toolbar"><div><h2 id="editorTitle">新增政策</h2><p class="question-excerpt">使用 Markdown 编写正文，右侧实时预览排版。</p></div><button class="btn secondary" id="backBtn">返回列表</button></div>
      <div class="policy-admin-grid">
        <form class="editor-card" id="policyForm">
          <input type="hidden" id="articleId">
          <div class="policy-fields">
            <div class="field full"><label>文章标题 *</label><input id="title" maxlength="180" required></div>
            <div class="field full"><label>摘要 *</label><textarea id="summary" maxlength="500" style="min-height:90px" required></textarea></div>
            <div><label>政策层级</label><select id="level"><option>国家</option><option>自治区</option><option selected>地区</option><option>县级</option></select></div>
            <div><label>政策分类</label><input id="category" value="政策动态"></div>
            <div><label>发布单位</label><input id="issuer"></div><div><label>适用地区</label><input id="region" value="喀什地区"></div>
            <div><label>政策文号</label><input id="documentNo"></div><div><label>申报/办理时间</label><input id="deadline"></div>
            <div class="full"><label>政府原文链接（HTTPS）</label><input id="originalUrl" type="url" placeholder="https://..."></div>
            <div class="full"><label>Markdown 正文 *</label><textarea id="markdown" maxlength="200000" required placeholder="# 政策标题&#10;&#10;## 主要内容&#10;&#10;- 第一项&#10;- 第二项"></textarea></div>
            <div><label>排序</label><input id="sortOrder" type="number" value="0"></div><div><label><input id="featured" type="checkbox"> 首页优先展示</label></div>
          </div>
          <p class="form-message" id="message"></p><div class="editor-actions"><button type="button" class="btn secondary" data-save="draft">保存草稿</button><button type="button" class="btn" data-save="published">发布文章</button></div>
        </form>
        <aside class="preview-card"><div class="preview-meta" id="previewMeta">Markdown 实时预览</div><article class="markdown-preview" id="preview"></article></aside>
      </div>
    </section>
  </main>
  <script src="/knowledge/site/runtime.js"></script><script src="/knowledge/policy-admin.js"></script>
</body></html>
