<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>公益小程序管理后台 · 喀什优棉</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6fa;color:#1a1a1a}.hidden{display:none!important}
    .sidebar{position:fixed;inset:0 auto 0 0;width:214px;z-index:100;display:flex;flex-direction:column;background:linear-gradient(180deg,#183d2e 0%,#28694e 100%)}.sidebar-logo{height:122px;padding:22px 16px;border-bottom:1px solid rgba(255,255,255,.1)}.logo-mark{font-size:28px}.sidebar-logo strong{display:block;margin-top:6px;color:#fff;font-size:16px}.sidebar-logo small{display:block;margin-top:3px;color:rgba(255,255,255,.55);font-size:11px}.nav{flex:1;padding:16px 0;overflow-y:auto}.nav-item{display:flex;align-items:center;gap:10px;padding:13px 20px;border-left:3px solid transparent;color:rgba(255,255,255,.7);font-size:14px}.nav-item.active{border-left-color:#c8902e;background:rgba(200,144,46,.2);color:#e1ae42}.nav-icon{width:22px;text-align:center;font-size:18px}.sidebar-user{padding:15px 16px;border-top:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.08)}.sidebar-user small{color:rgba(255,255,255,.55);font-size:11px}.sidebar-user strong{display:block;margin:5px 0 12px;color:#fff;font-size:13px}.logout-btn{width:100%;padding:10px;border:0;border-radius:8px;background:rgba(166,81,64,.35);color:#ffb8a9;cursor:pointer;font-weight:700}
    .main{min-height:100vh;margin-left:214px}.topbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #e4e7ed;background:#fff}.topbar h1{font-size:17px}.topbar time{color:#8b9198;font-size:12px}.content{padding:27px}.panel-card{overflow:hidden;border:1px solid #eef0f4;border-radius:15px;background:#fff;box-shadow:0 4px 16px rgba(38,51,47,.05)}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:19px 21px;border-bottom:1px solid #eceef2}.toolbar h2{font-size:16px}.toolbar p{margin-top:5px;color:#8b9390;font-size:12px}.btn{padding:9px 17px;border:0;border-radius:8px;background:#237657;color:#fff;cursor:pointer;font:inherit;font-size:13px;font-weight:700}.btn.secondary{border:1px solid #d7ded9;background:#fff;color:#52625b}.data-table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;font-size:13px}.data-table th,.data-table td{padding:13px 14px;border-bottom:1px solid #eff1f3;text-align:left;vertical-align:middle}.data-table th{background:#fafafa;color:#777f7b;font-weight:600}.data-table tr:last-child td{border-bottom:0}.question-excerpt{display:inline-block;max-width:430px;margin-top:5px;overflow:hidden;color:#8c9490;white-space:nowrap;text-overflow:ellipsis}.status-pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#fff1d5;color:#9a681f;font-size:11px}.status-pill.published{background:#e5f5ec;color:#14714f}.table-actions{display:flex;gap:7px}.small-btn{padding:6px 10px;border:1px solid #dbe2de;border-radius:6px;background:#fff;color:#4f6159;cursor:pointer;font-size:12px}.small-btn.primary{border-color:#bcdccc;background:#eaf6f0;color:#176b4d}.small-btn.danger{border-color:#edd0ca;background:#fff2ef;color:#a44635}
    .editor-shell{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(350px,.95fr);gap:20px}.editor-card,.preview-card{border:1px solid #eef0f4;border-radius:15px;background:#fff;box-shadow:0 4px 16px rgba(38,51,47,.05)}.editor-head,.preview-head{padding:18px 21px;border-bottom:1px solid #eceef2}.editor-head{display:flex;align-items:center;justify-content:space-between}.editor-head h2,.preview-head h2{font-size:16px}.editor-body{padding:21px}.policy-fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.policy-fields .full{grid-column:1/-1}.policy-fields label{display:block;margin-bottom:7px;color:#46564f;font-size:12px;font-weight:700}.policy-fields input,.policy-fields select,.policy-fields textarea{width:100%;padding:10px 11px;border:1px solid #d9dfdc;border-radius:7px;outline:none;font:inherit;font-size:13px}.policy-fields input:focus,.policy-fields select:focus,.policy-fields textarea:focus{border-color:#2b8060;box-shadow:0 0 0 3px rgba(43,128,96,.09)}.policy-fields textarea{min-height:340px;resize:vertical;font-family:Consolas,monospace;line-height:1.65}.policy-fields textarea.summary-input{min-height:86px;font-family:inherit}.checkbox-label{display:flex!important;align-items:center;gap:8px;height:39px}.checkbox-label input{width:auto}.editor-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:19px}.form-message{min-height:20px;margin-top:13px;color:#a14839;font-size:12px}.preview-meta{margin-top:5px;color:#8a928e;font-size:12px}.markdown-preview{min-height:570px;padding:22px;color:#29443a;line-height:1.8}.markdown-preview h1,.markdown-preview h2,.markdown-preview h3{margin:20px 0 10px;color:#165b43}.markdown-preview p{margin:10px 0}.markdown-preview ul{padding-left:25px}.markdown-preview blockquote{margin:14px 0;padding:10px 16px;border-left:4px solid #42a77e;background:#edf7f2}.markdown-preview code{padding:2px 6px;border-radius:5px;background:#f0f3f1}
    .modal-mask{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,34,27,.48)}.modal-card{width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:15px;background:#fff;box-shadow:0 22px 70px rgba(0,0,0,.22)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #eceef2}.modal-head h2{font-size:17px}.modal-close{border:0;background:none;color:#738078;cursor:pointer;font-size:24px}.modal-body{padding:22px}.farmer-actions{display:flex;gap:7px}.status-on{color:#168153;font-weight:700}.status-off{color:#a54a3b;font-weight:700}
    @media(max-width:980px){.sidebar{width:188px}.main{margin-left:188px}.editor-shell{grid-template-columns:1fr}.policy-fields{grid-template-columns:1fr}.policy-fields .full{grid-column:auto}}@media(max-width:720px){.sidebar{position:static;width:100%;height:auto}.sidebar-logo{height:auto}.nav{padding:0}.sidebar-user{display:none}.main{margin-left:0}.topbar{padding:0 16px}.content{padding:14px}.policy-fields{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-mark">🌾</div><strong>喀什优棉公益后台</strong><small>Public Mini Program Admin</small></div>
    <nav class="nav"><div class="nav-item active" data-view="policies"><span class="nav-icon">📜</span><span>政策中心</span></div><div class="nav-item" data-view="farmers"><span class="nav-icon">👨‍🌾</span><span>农户管理</span></div><div class="nav-item" data-view="security"><span class="nav-icon">🔒</span><span>账号安全</span></div></nav>
    <div class="sidebar-user"><small>当前登录</small><strong id="adminName">公益小程序管理员</strong><button class="logout-btn" id="logoutBtn">退出登录</button></div>
  </aside>
  <main class="main">
    <header class="topbar"><h1 id="pageTitle">政策中心</h1><time id="clock"></time></header>
    <div class="content">
      <section id="listPanel" class="panel-card">
        <div class="toolbar"><div><h2>政策文章管理</h2><p>草稿不会出现在小程序；发布后将同步到小程序“政策中心”。</p></div><button class="btn" id="addBtn">＋ 新增政策</button></div>
        <div class="data-table-wrap"><table class="data-table"><thead><tr><th>标题</th><th>层级/分类</th><th>发布单位</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="articleTable"><tr><td colspan="6">加载中...</td></tr></tbody></table></div>
      </section>
      <section id="editorPanel" class="hidden">
        <div class="editor-shell">
          <form class="editor-card" id="policyForm">
            <div class="editor-head"><div><h2 id="editorTitle">新增政策</h2></div><button type="button" class="btn secondary" id="backBtn">返回列表</button></div>
            <div class="editor-body"><input type="hidden" id="articleId"><div class="policy-fields">
              <div class="full"><label>文章标题 *</label><input id="title" maxlength="180" required></div>
              <div class="full"><label>摘要 *</label><textarea class="summary-input" id="summary" maxlength="500" required></textarea></div>
              <div><label>政策层级</label><select id="level"><option>国家</option><option>自治区</option><option selected>地区</option><option>县级</option></select></div>
              <div><label>政策分类</label><input id="category" value="政策动态"></div>
              <div><label>发布单位</label><input id="issuer"></div><div><label>适用地区</label><input id="region" value="喀什地区"></div>
              <div><label>政策文号</label><input id="documentNo"></div><div><label>申报/办理时间</label><input id="deadline"></div>
              <div class="full"><label>政府原文链接（HTTPS）</label><input id="originalUrl" type="url" placeholder="https://..."></div>
              <div class="full"><label>Markdown 正文 *</label><textarea id="markdown" maxlength="200000" required placeholder="# 政策标题&#10;&#10;## 主要内容&#10;&#10;- 第一项&#10;- 第二项"></textarea></div>
              <div><label>排序</label><input id="sortOrder" type="number" value="0"></div><div><label class="checkbox-label"><input id="featured" type="checkbox">首页优先展示</label></div>
            </div><p class="form-message" id="message"></p><div class="editor-actions"><button type="button" class="btn secondary" data-save="draft">保存草稿</button><button type="button" class="btn" data-save="published">发布文章</button></div></div>
          </form>
          <aside class="preview-card"><div class="preview-head"><h2>Markdown 实时预览</h2><div class="preview-meta" id="previewMeta">填写内容后自动预览</div></div><article class="markdown-preview" id="preview"></article></aside>
        </div>
      </section>
      <section id="securityPanel" class="panel-card hidden">
        <div class="toolbar"><div><h2>账号安全</h2><p>定期更换高强度密码，修改成功后需要重新登录。</p></div></div>
        <form id="passwordForm" style="max-width:620px;padding:26px 22px 32px">
          <div class="policy-fields" style="grid-template-columns:1fr">
            <div><label>当前密码</label><input id="oldPassword" type="password" autocomplete="current-password" required></div>
            <div><label>新密码</label><input id="newPassword" type="password" autocomplete="new-password" required><div style="margin-top:7px;color:#8a928e;font-size:12px">至少10位，并同时包含大写字母、小写字母、数字和特殊符号。</div></div>
            <div><label>确认新密码</label><input id="confirmPassword" type="password" autocomplete="new-password" required></div>
          </div>
          <p class="form-message" id="passwordMessage"></p><div class="editor-actions"><button class="btn" type="submit">修改登录密码</button></div>
        </form>
      </section>
      <section id="farmerPanel" class="panel-card hidden">
        <div class="toolbar"><div><h2>农户管理</h2><p>查看、创建和维护与智能体后台共享的农户账号。</p></div><button class="btn" id="addFarmerBtn">＋ 新增农户</button></div>
        <div class="data-table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>手机号</th><th>姓名</th><th>地区</th><th>面积（亩）</th><th>实名</th><th>状态</th><th>操作</th></tr></thead><tbody id="farmerTable"><tr><td colspan="8">加载中...</td></tr></tbody></table></div>
      </section>
    </div>
  </main>
  <div id="farmerModal" class="modal-mask hidden" role="dialog" aria-modal="true" aria-labelledby="farmerModalTitle">
    <form class="modal-card" id="farmerForm">
      <div class="modal-head"><h2 id="farmerModalTitle">新增农户</h2><button class="modal-close" id="closeFarmerModal" type="button" aria-label="关闭">×</button></div>
      <div class="modal-body"><input id="farmerId" type="hidden"><div class="policy-fields">
        <div><label>手机号</label><input id="farmerPhone" inputmode="numeric" maxlength="11" required></div>
        <div id="farmerPasswordWrap"><label>初始密码</label><input id="farmerPassword" type="password" autocomplete="new-password"></div>
        <div><label>姓名</label><input id="farmerName" maxlength="64" required></div>
        <div><label>所在地区</label><input id="farmerLocation" maxlength="120"></div>
        <div><label>棉田面积（亩）</label><input id="farmerLand" type="number" min="0" step="0.01"></div>
        <div><label>实名状态</label><select id="farmerVerified"><option value="0">未实名</option><option value="1">已实名</option></select></div>
      </div><p class="form-message" id="farmerMessage"></p><div class="editor-actions"><button class="btn secondary" id="cancelFarmerBtn" type="button">取消</button><button class="btn" type="submit">保存农户</button></div></div>
    </form>
  </div>
  <script src="/knowledge/site/runtime.js"></script><script src="/knowledge/policy-admin.js"></script>
</body></html>
