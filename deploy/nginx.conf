map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream cotton_app {
    zone cotton_app 64k;
    server app:3000 resolve;
}

upstream cotton_community {
    zone cotton_community 64k;
    server community:3100 resolve;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 500m;

    location = /knowledge {
        return 301 /knowledge/;
    }

    location = /public {
        return 301 /public/;
    }

    location ^~ /public/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location = /business {
        return 301 /business/;
    }

    location ^~ /business/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location ^~ /knowledge/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location ^~ /assets/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location ^~ /uploads/knowledge/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/knowledge/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/community-auth/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/community-ai/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/public-service/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/policies/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location = /api/policies {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/service-products/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location = /api/service-products {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/pest-knowledge/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location = /api/pest-knowledge {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/cotton-varieties/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location = /api/cotton-varieties {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/processing-factories/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location = /api/processing-factories {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/expert-studio/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location = /api/expert-studio {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/plot-daily-work/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location = /api/plot-daily-work {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/voice-briefings/ {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location = /api/voice-briefings {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location = /api/community-health {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location = /platform {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location = /platform/admin {
        proxy_pass http://cotton_community;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://cotton_app;
        include /etc/nginx/proxy_params;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
